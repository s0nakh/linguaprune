[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linguasqueeze"
version = "0.7.0"
description = "Compress LLMs for Kazakh and Russian so they run on affordable hardware without losing the language"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sophia Akhmetova" }]
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
eval = ["datasets", "pandas", "transformers>=5"]
test = ["pytest", "pandas", "transformers>=5"]

[project.urls]
Homepage = "https://github.com/s0nakh/linguasqueeze"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
